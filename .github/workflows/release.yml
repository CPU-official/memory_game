name: release

# v로 시작하는 태그를 푸시하면 자동으로 윈도우 exe 를 만들어서 릴리즈에 올림
#   예)  git tag v1.0.0  →  git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # 깃허브 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 코드 받아오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 패키지 설치
        run: npm install

      - name: exe 만들기
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      - name: (태그 없이 돌렸을 때) 결과물 보관
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGame-windows
          path: dist/*.exe
